[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conesrs"
version = "0.1.0"
description = "Independent secondary dose/MU check for fixed-cone cranial SRS"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydicom>=3.0",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
conesrs = "conesrs.cli:main"

[tool.setuptools.packages.find]
include = ["conesrs*"]

[tool.setuptools.package-data]
"conesrs.config" = ["machines.default.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
